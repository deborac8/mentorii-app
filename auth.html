<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorii — Autenticação & Privacidade de Perfis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-page);
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header h1 {
            font-size: 24px;
            margin-top: 4px;
        }
        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .auth-tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text-dim);
            border: none;
            padding: 8px;
            font-size: 12px;
            border-bottom: 2px solid transparent;
            border-radius: 0;
        }
        .auth-tab-btn.active {
            color: var(--purple);
            border-bottom-color: var(--purple);
            background: transparent;
            font-weight: 700;
        }
        .auth-form-group {
            margin-bottom: 16px;
        }
        .auth-form-group label {
            display: block;
            font-family: var(--mono);
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .user-card-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }
        .user-card-item:hover {
            border-color: var(--purple);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="eyebrow">Career Operating System</div>
            <h1>Mentorii Cockpit</h1>
            <p class="topbar-description" style="margin-top: 4px;">Perfis Privados Protegidos por Senha Local.</p>
        </div>

        <div class="auth-tabs">
            <button type="button" class="auth-tab-btn active" id="tab-btn-login" onclick="switchAuthTab('login')">Entrar em Perfil</button>
            <button type="button" class="auth-tab-btn" id="tab-btn-register" onclick="switchAuthTab('register')">+ Novo Perfil Privado</button>
        </div>

        <div id="auth-section-login">
            <div id="saved-users-list" style="margin-bottom: 16px;"></div>
            
            <div id="no-users-msg" style="display: none; text-align: center; color: var(--text-dim); padding: 20px; font-size: 12px; font-family: var(--mono);">
                Nenhum perfil cadastrado neste navegador.<br>Clique na aba <b>"+ Novo Perfil Privado"</b> para começar!
            </div>
        </div>

        <form id="auth-section-register" style="display: none;" onsubmit="handleCreateProfile(event)">
            <div class="auth-form-group">
                <label for="reg-name">Nome do Usuário:</label>
                <input type="text" id="reg-name" class="input-text" style="width: 100%;" placeholder="Digite seu identificador" required>
            </div>

            <div class="auth-form-group">
                <label for="reg-type">Área de Atuação / Domínio:</label>
                <select id="reg-type" class="select-priority" style="width: 100%;">
                    <option value="engineering" selected>Tecnologia / Desenvolvimento / Engenharia</option>
                    <option value="concurso">Concursos Públicos</option>
                    <option value="vestibular">Vestibulares / Acadêmico</option>
                </select>
            </div>

            <div class="auth-form-group">
                <label for="reg-pass">Senha Privada de Acesso (PIN):</label>
                <input type="password" id="reg-pass" class="input-text" style="width: 100%;" placeholder="Senha para proteger seus dados" required>
            </div>

            <div class="auth-form-group">
                <label for="reg-goal">Objetivo / Meta Principal (Opcional):</label>
                <input type="text" id="reg-goal" class="input-text" style="width: 100%;" placeholder="Meta principal de estudos">
            </div>

            <button type="submit" class="btn-action" style="width: 100%; padding: 10px; margin-top: 8px;">🔒 Criar Perfil Privado</button>
        </form>
    </div>

    <script src="mentorii-core.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderSavedUsers();
        });

        function switchAuthTab(tab) {
            const loginSection = document.getElementById('auth-section-login');
            const regSection = document.getElementById('auth-section-register');
            const btnLogin = document.getElementById('tab-btn-login');
            const btnReg = document.getElementById('tab-btn-register');

            if (tab === 'login') {
                loginSection.style.display = 'block';
                regSection.style.display = 'none';
                btnLogin.classList.add('active');
                btnReg.classList.remove('active');
                renderSavedUsers();
            } else {
                loginSection.style.display = 'none';
                regSection.style.display = 'block';
                btnLogin.classList.remove('active');
                btnReg.classList.add('active');
            }
        }

        function renderSavedUsers() {
            const container = document.getElementById('saved-users-list');
            const noUsersMsg = document.getElementById('no-users-msg');
            const db = MentoriiCore.getAllUsersDB();
            const keys = Object.keys(db);

            container.innerHTML = "";

            if (keys.length === 0) {
                noUsersMsg.style.display = 'block';
                return;
            }

            noUsersMsg.style.display = 'none';

            keys.forEach(key => {
                const u = db[key];
                const name = u.profile?.name || "Usuário";
                const type = (u.profile?.profileType || "geral").toUpperCase();
                const goal = u.profile?.targetGoal || "Meta não configurada";

                const card = document.createElement('div');
                card.className = 'user-card-item';
                card.innerHTML = `
                    <div onclick="promptLoginWithKey('${key}', '${name}')" style="flex: 1; cursor: pointer;">
                        <div style="font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text);">🔒 👤 ${name}</div>
                        <div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;">
                            <span class="tag" style="font-size: 9px;">${type}</span> ${goal}
                        </div>
                    </div>
                    <button type="button" onclick="deleteUserKey(event, '${key}', '${name}')" style="color: var(--red); background: transparent; border: none; font-size: 14px; padding: 4px 8px;" title="Excluir Perfil">🗑️</button>
                `;
                container.appendChild(card);
            });
        }

        function promptLoginWithKey(userKey, name) {
            const pass = prompt(`Digite a senha privada para acessar o perfil de ${name}:`);
            if (pass === null) return;

            const success = MentoriiCore.loginUser(userKey, pass);
            if (success) {
                window.location.href = 'index.html';
            } else {
                alert("❌ Senha incorreta! Acesso negado.");
            }
        }

        function handleCreateProfile(event) {
            event.preventDefault();
            const nameInput = document.getElementById('reg-name');
            const typeInput = document.getElementById('reg-type');
            const passInput = document.getElementById('reg-pass');
            const goalInput = document.getElementById('reg-goal');

            if (!nameInput.value.trim() || !passInput.value) return;

            const userKey = MentoriiCore.createUser(nameInput.value.trim(), typeInput.value, passInput.value);
            
            if (goalInput.value.trim()) {
                MentoriiCore.state.profile.targetGoal = goalInput.value.trim();
                MentoriiCore.save();
            }

            window.location.href = 'index.html';
        }

        function deleteUserKey(event, key, name) {
            event.stopPropagation();
            const pass = prompt(`Para excluir o perfil de "${name}", digite a senha de segurança:`);
            if (pass === null) return;

            const db = MentoriiCore.getAllUsersDB();
            if (db[key] && db[key].profile?.password === pass) {
                delete db[key];
                MentoriiCore.saveAllUsersDB(db);

                const remainingKeys = Object.keys(db);
                if (remainingKeys.length > 0) {
                    localStorage.setItem('mentorii_active_user_key', remainingKeys[0]);
                } else {
                    localStorage.removeItem('mentorii_active_user_key');
                }

                renderSavedUsers();
                alert("🗑️ Perfil excluído com sucesso.");
            } else {
                alert("❌ Senha incorreta. Exclusão cancelada.");
            }
        }
    </script>
</body>
</html>
